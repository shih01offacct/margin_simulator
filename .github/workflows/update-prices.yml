name: 更新股價 prices.json

on:
  schedule:
    # 台灣時間 週一~五 15:30 與 19:00(UTC 07:30 / 11:00)各抓一次
    - cron: '30 7 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:   # 也可在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取證交所 / 櫃買中心收盤價
        run: python scripts/fetch_prices.py

      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "prices.json 無變動,略過"
          else
            git commit -m "chore: 更新股價 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') (台北時間)"
            git push
          fi
